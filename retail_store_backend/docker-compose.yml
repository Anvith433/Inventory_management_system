version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: retail_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "8861102894Aa#"
      MYSQL_DATABASE: "retail_store_management_system"
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: